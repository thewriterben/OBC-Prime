name: peer token

# A canary for one credential, and nothing else.
#
# `parity`'s `peer` job cannot compare the 12 generator mirrors without
# PEER_REPO_TOKEN, a fine-grained PAT on a private repository. The PAT in place
# until 2026-09-12 lapsed twice — found 2026-09-06, and again 2026-09-11 — and
# each time the discovery was the same: someone pushed, `parity` went red, and
# the red looked like a drifted mirror. `check_peer_access.py` fixed the
# *legibility* of that red. It did not change when anyone finds out.
#
# This does. Once a day the probe runs on its own, so the token dying surfaces
# within a day rather than on whatever merge happens to come next.
#
# The 2026-09-12 replacement does not expire, which removes the specific clock
# that caused both lapses and none of the reasons for this job. A token that
# cannot expire can still be revoked, dropped by an organisation policy sweep,
# or lose access when a repository is renamed — and a non-expiring token is the
# kind most likely to be swept, precisely because it never prompts a review.
# All of those arrive as the same "Bad credentials".
#
# An earlier version of this warned a week ahead by reading GitHub's
# `github-authentication-token-expiration` header. Removed the same day, once
# the new token turned out not to expire: the branch could not fire, and a
# safety net that cannot catch anything is worse than an honest absence of one.
#
# Why a separate workflow rather than a `schedule:` on parity.yml: that file has
# twelve jobs, one of which builds every vendored crate twice and another of
# which installs cargo-audit from source. Running all of it daily to check one
# credential would cost twenty minutes a day and bury the answer among eleven
# other results. A notification that says "peer token" says what happened.
#
# Note for whoever finds this quiet: GitHub disables scheduled workflows after
# 60 days with no repository activity, and says so by email. It is not a silent
# stop, but it is a stop — `workflow_dispatch` is here so it can be re-run by
# hand to confirm it still works.

on:
  schedule:
    # 06:17 UTC. Not on the hour: GitHub's scheduler queues heavily at :00 and
    # delays are common enough that the docs mention them.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  canary:
    name: the generator token still works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The gate's own cases first. A canary that has quietly stopped being able
      # to tell a live token from a dead one is worse than no canary, because its
      # green is the thing being trusted.
      - run: python scripts/check_peer_access.py --selftest
      - name: PEER_REPO_TOKEN still reads the generator
        env:
          PEER_REPO_TOKEN: ${{ secrets.PEER_REPO_TOKEN }}
        run: python scripts/check_peer_access.py
