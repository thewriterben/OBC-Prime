# A workspace over the vendored agent crates.
#
# These are copies, verified by SHA-256 against the core repository — the same
# arrangement as `registry/`, `parity/fixtures/`, `wasm/` and `firmware/`. What
# makes them different is that this repository can *run* them: `cargo test
# --workspace` here executes 1036 tests of real agent code, so the public project
# checks the substrate it documents instead of describing one it cannot build.
#
# That number said 473 until 2026-08-13 — true when six crates were vendored,
# and left behind by every sync since. It was missed by the same sync that
# existed to correct the README's stale count, which is the argument for
# grepping for a figure rather than updating the copy you remember.
#
# Then it said 653 for a day, through a sync that took the tree to 658, while
# `check_counts.py` printed ok — this comment block has no blank lines in it,
# so the date on the line above was excluding every number in the block from
# the gate. Fixed 2026-08-14 by ending a paragraph at a bare `#` as well.
#
# Do not edit these by hand. Change them upstream, then
# `python scripts/sync_upstream.py sync --upstream ../Oh-Ben-Claw`; the drift
# gate exists to catch exactly that mistake.
[workspace]
members = [
    "crates/obc-paths",
    "crates/obc-memory",
    "crates/obc-planner",
    "crates/obc-safety",
    "crates/obc-telemetry",
    "crates/obc-observability",
    "crates/obc-scheduler",
    "crates/obc-conscience",
    "crates/obc-a2a",
    "crates/obc-movement",
    "crates/obc-navigation",
    "crates/obc-tool-api",
    "crates/obc-reflex",
    "crates/obc-foresight",
    "crates/obc-learning",
    "crates/obc-fleet",
    "crates/obc-audio",
    "crates/obc-mission",
    "crates/obc-position",
    "crates/obc-cost",
    "crates/obc-tunnel",
    "crates/obc-approval",
    "crates/obc-spine",
    "crates/obc-tools",
    "crates/obc-providers",
    "crates/obc-mcp",
    "crates/obc-vision",
    # Written here, not vendored — see demo/Cargo.toml for why it is not
    # under crates/.
    "demo",
]
resolver = "2"
